name: Build Docker Image

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zlitepan

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tags
        id: tags
        run: |
          BRANCH=${GITHUB_REF_NAME//\//-}
          SHA_SHORT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          echo "branch_tag=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha_tag=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "time_tag=${BRANCH}-${TIMESTAMP}" >> $GITHUB_OUTPUT

          if [ "$BRANCH" = "main" ]; then
            echo "tags=${BRANCH},latest,${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          else
            echo "tags=${BRANCH},${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
